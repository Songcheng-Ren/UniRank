UniMixer_QK_Video_Action: # This is a config template
    model: UniMixer
    dataset_id: QK_Video_Action
    loss: ['binary_crossentropy', 'binary_crossentropy', 'binary_crossentropy', 'binary_crossentropy']
    num_tasks: 4
    metrics: ['logloss', 'AUC']
    task: binary_classification
    batch_size: 8192
    embedding_dim: 16
    num_layers: 3
    expansion_factor: 2
    token_dim: 256
    num_tokens: 4
    num_basis: 4
    global_rank: 64
    sinkhorn_iter: 5
    sinkhorn_eps: 1.0e-6
    tau: 1.0
    tau_end: 0.05
    tau_schedule: linear
    tau_anneal_steps: 20000
    tau_warmup_steps: 1000
    use_out_proj: False
    use_local_coef_softmax: True
    use_tau_symmetry: True
    tower_hidden_units: [128, 64]
    tower_activations: ReLU
    net_dropout: 0
    epochs: 1
    shuffle: True
    seed: 20262027
    monitor: {'AUC': 1, 'logloss': 0}
    monitor_mode: 'max'
    max_len: 100
    accumulation_steps: 1

